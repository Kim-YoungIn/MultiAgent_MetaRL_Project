# Project-local defaults for MAMRL (Codex CLI 0.159.0+ for Terra).
# Lead Agent: Antigravity | Codex Role: Scoped Collaborator & Specialist Subagents.
# Mandatory entry points: AGENTS.md -> handoff/BOARD.md -> assigned handoff/tasks/TASK-*.md.
model = "gpt-6.2-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6.1-terra"
default_subagent_reasoning_effort = "high"
